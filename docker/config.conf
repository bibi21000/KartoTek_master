[flask]
host = 0.0.0.0
port = 5003
# Ne jamais activer debug=true en production (consommation mémoire, reloader, sécurité)
debug = false

[database]
path = /data/gps_data.db

[polling]
# Fichier contenant la liste des serveurs à interroger
servers_file = servers.json
# Fréquence de vérification du dbid, en minutes
interval_minutes = 15
# Délai avant la toute première vérification au démarrage (en secondes)
initial_delay_seconds = 3

[api]
# Nombre de points GPS demandés par page lors de la synchronisation
gps_page_size = 500
# Timeout des requêtes HTTP sortantes (secondes)
request_timeout_seconds = 10
# Nombre de tentatives en cas d'échec réseau
retry_attempts = 3
# Délai entre 2 tentatives (secondes)
retry_backoff_seconds = 2

[map]
default_lat = 46.603354
default_lon = 1.888334
default_zoom = 6
# À partir de ce niveau de zoom, on affiche les points bruts plutôt que des clusters
cluster_zoom_threshold = 14
# Nombre maximum de points renvoyés en une seule requête (protection mémoire/réseau)
max_points_returned = 5000

[logging]
level = INFO
file = logs/app.log
