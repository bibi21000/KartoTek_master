[flask]
host = 0.0.0.0
port = 5010
# Ne jamais activer debug=true en production (consommation mémoire, reloader, sécurité)
debug = false
# Répertoire (relatif à la racine du projet, ou chemin absolu) où déposer
# les fichiers exposés en HTTP à la racine du domaine (vérification de
# propriété de site pour l'indexation : Google Search Console, Bing...).
# Les fichiers doivent se trouver dans <html_dir>/verification/.
html_dir = data
# Requis pour les sessions/flash (formulaire de contact) et pour que la
# langue choisie (?lang=) persiste entre les requêtes. Laissez vide pour
# qu'une clé aléatoire soit générée au démarrage (les sessions ne
# survivront alors pas à un redémarrage) ; définissez une valeur fixe et
# secrète pour un déploiement durable.
secret_key =
# Répertoire (relatif à la racine du projet, ou chemin absolu) contenant
# les fichiers proposés au téléchargement sur la page /download/
# (paquets, installeurs de l'application...). Tous les fichiers déposés
# directement à la racine de ce dossier (pas les sous-dossiers) y sont
# listés.
download_dir = data/downloads

[database]
path = data/gps_data.db

[polling]
# Fichier contenant la liste des serveurs à interroger
servers_file = conf/servers.json
# Fréquence de vérification du dbid, en minutes
interval_minutes = 15
# Délai avant la toute première vérification au démarrage (en secondes)
initial_delay_seconds = 3
rate_limit_storage_uri = memory://
rate_limit_key_prefix = kartotek-master

[api]
# Nombre de points GPS demandés par page lors de la synchronisation
gps_page_size = 500
# Timeout des requêtes HTTP sortantes (secondes)
request_timeout_seconds = 10
# Nombre de tentatives en cas d'échec réseau
retry_attempts = 3
# Délai entre 2 tentatives (secondes)
retry_backoff_seconds = 2

[map]
default_lat = 46.603354
default_lon = 1.888334
default_zoom = 6
# À partir de ce niveau de zoom, on affiche les points bruts plutôt que des clusters
cluster_zoom_threshold = 14
# Nombre maximum de points renvoyés en une seule requête (protection mémoire/réseau)
max_points_returned = 5000

[logging]
level = INFO
file = logs/app.log

[contact]
# Page /contact/ désactivée tant que contact_email et smtp_host sont vides.
contact_email =
smtp_host =
smtp_port = 587
smtp_user =
smtp_password =
# "starttls" (port 587) ou "ssl" (port 465)
smtp_security = starttls

[gunicorn]
# Lu par gunicorn.conf.py. Chaque valeur reste surchargeable par une
# variable d'environnement KARTOTEK_MASTER_<NOM_EN_MAJUSCULES>.
bind = 0.0.0.0:5003
# 1 seul worker par défaut : le thread de polling tourne par process
# (voir le commentaire dans gunicorn.conf.py).
workers = 1
threads = 8
timeout = 30
graceful_timeout = 30
keepalive = 5
accesslog = logs/gunicorn-access.log
errorlog = logs/gunicorn-error.log
loglevel = info

[push]
max_radius_m = 5000
notify_secret = <chaîne aléatoire longue, ex: python3 -c "import secrets; print(secrets.token_urlsafe(32))">
fcm_project_id = kartotek-mobile
fcm_service_account_file = /opt/kartotek_master/secrets/fcm-service-account.json
apns_key_file = /opt/kartotek_master/secrets/AuthKey_ABCDEF1234.p8
apns_key_id = ABCDEF1234
apns_team_id = TEAMID1234
apns_topic = eu.kartotek.mobile
apns_use_sandbox = false
notification_title = Nouvelle carte postale à proximité

